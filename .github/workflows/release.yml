name: GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)create the release for, e.g. v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create release from CHANGELOG.md
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Extract the changelog section for this tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { printing = ($0 ~ "^## " v "([^0-9]|$)") ; next }
            printing { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md

          if [ -s release-notes.md ]; then
            echo "Notes from CHANGELOG.md:"; cat release-notes.md
          else
            echo "No \"## $version\" section in CHANGELOG.md; only the merged pull requests go in the notes."
          fi

      # GitHub's list of merged pull requests under the summary (Dependabot is left
      # out by .github/release.yml). The maintainer's own "first contribution" line
      # is dropped, and the New Contributors heading with it when nobody is left.
      - name: Append the merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Relative links (docs/x.md, UPGRADE.md) work in the repo, not on a release page.
          perl -pi -e 's{\]\((?![a-z][a-z0-9+.-]*:|#|/)([^)\s]+)\)}{](https://github.com/$ENV{GITHUB_REPOSITORY}/blob/$ENV{TAG}/$1)}g' release-notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body \
            | perl -0pe 's/^\* \@icaliman made their first contribution[^\n]*\n//mg; s/^## New Contributors\n+(?=\*\*Full Changelog|\z)//mg' \
            > generated.md
          if [ -s release-notes.md ]; then echo >> release-notes.md; fi
          cat generated.md >> release-notes.md
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          # A tag with a suffix (v1.0.0-beta.1) is published as a pre-release.
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag $prerelease

  # The recorder for a frontend on another origin (docs/standalone.md), from the same sources as resources/dist:
  # @packstub/session-replay at the tag's version. Needs the NPM_TOKEN secret (an npm automation token with publish
  # rights on @packstub). Only on a tag push; a manual run for an old tag leaves npm alone.
  npm:
    name: Publish @packstub/session-replay to npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Build at the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm ci --ignore-scripts
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm run build
          npm test
          npm run test:types

      # npm takes the README beside package.json, which is the Composer package's: the npm package has its own.
      - name: Use the npm package's README
        run: cp npm/README.md README.md

      - name: Publish with provenance
        env:
          TAG: ${{ github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # A tag with a suffix (v1.3.0-beta.1) goes out under "next", never as "latest".
          dist_tag="latest"
          if [[ "$TAG" == *-* ]]; then dist_tag="next"; fi
          npm publish --provenance --access public --tag "$dist_tag" --ignore-scripts
