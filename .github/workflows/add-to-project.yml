name: Add to Plugins board

# New issues and pull requests land on the Plugins project (github.com/orgs/packstub/projects/1).
# PROJECTS_TOKEN is a fine-grained personal access token with read and write on Projects, set per repo (resource owner packstub, org permission Projects).

on:
  issues:
    types: [opened, reopened]
  # Fork PRs get no secrets on pull_request. Safe only because this job never checks out or runs the PR's code: keep it so.
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/packstub/projects/1
          github-token: ${{ secrets.PROJECTS_TOKEN }}
