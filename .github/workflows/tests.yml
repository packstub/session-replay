name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, zlib
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest

  javascript:
    name: Recorder and player (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the JavaScript tests
        run: node --test resources/js/tests/*.test.js

  e2e:
    name: Assist end to end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, intl, zlib
          # EGPCS: the e2e server's database and cache come from the environment (playwright.config.js), and the
          # app reads it through $_ENV; the runner's default GPCS leaves $_ENV empty and the workers on :memory:.
          ini-values: variables_order=EGPCS
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # packstub/holler from Packagist (require-dev) and @packstub/holler from npm; npm ci brings Playwright.
      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress
          npm ci
          npx playwright install --with-deps chromium

      # The pages load the committed resources/dist, so check it is what the sources build.
      - name: The committed bundle is up to date
        run: |
          npm run build
          git diff --exit-code --stat -- resources/dist

      # The npm package (@packstub/session-replay): its declarations against what a TypeScript frontend writes, and
      # the built module imported where there is no window (server-side rendering).
      - name: The npm package's types and build
        run: |
          npm run test:types
          node -e "import('./npm/dist/index.js').then((m) => { if (m.isRecording() !== false || JSON.stringify(m.header()) !== '{}') process.exit(1); })"

      - name: Run Assist between two browsers
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          # The server's log beside the traces: a 500 in a trace has no body, the exception is only here.
          path: |
            test-results
            vendor/orchestra/testbench-core/laravel/storage/logs

  # The one check the main branch requires (Settings → Rules): green only when every job above is.
  # A new job goes in `needs`, so the required name stays the same when the matrix changes.
  tests-passed:
    name: Tests passed
    if: always()
    needs: [tests, javascript, e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
