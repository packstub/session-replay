name: Tests

on:
  # Pull requests run once (pull_request); a push runs only on main, after the merge.
  push:
    branches: [main]
  pull_request:

# A newer commit on a pull request replaces the run in progress. A push to main gets a group of its own, so it is never
# cancelled or left waiting: each run compares only its own push, and a docs push right after a code push would
# otherwise cancel the only run that tests the code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether anything but docs, Markdown and the release plumbing changed. When nothing did, the test jobs skip and
  # "Tests passed" still reports (a required check must report, so no paths-ignore on the workflow). Anything not on
  # the list counts as code, so a new kind of file runs the tests.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      # Two commits are enough: a pull request is checked out as its merge commit, whose first parent is the base.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # The merge commit against main as it is now: exactly what merging would change, wherever the branch started
            # (the event's base.sha can be older than the main the merge commit was made with).
            base=""
            if git rev-parse -q --verify "HEAD^2" >/dev/null; then base="HEAD^1"; fi
          else
            # A push to main: everything since the commit main pointed at before, fetched on its own (no history needed).
            base="$BEFORE"
            if [ -n "$base" ]; then git fetch --quiet --no-tags --depth=1 origin "$base" 2>/dev/null || true; fi
          fi
          # No base to compare with (a new branch, a force push that dropped it): run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base to compare with: the tests run."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames: a file moved onto the list (src/Foo.php to docs/foo.md) still shows its old path.
          git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "Changed since $(git rev-parse --short "$base"):"; cat "$RUNNER_TEMP/changed.txt"
          skip='^(docs/|art/|.*\.md$|\.github/((release|dependabot|FUNDING)\.yml$|ISSUE_TEMPLATE/|workflows/(release|docs-sync|add-to-project|dependabot-auto-merge|fix-php-code-style-issues)\.yml$))'
          if grep -qvE "$skip" "$RUNNER_TEMP/changed.txt"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, Markdown or release plumbing changed: the tests skip."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests (PHP ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, zlib
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest

  javascript:
    name: Recorder and player (Node)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the JavaScript tests
        run: node --test resources/js/tests/*.test.js

  e2e:
    name: Assist end to end (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, intl, zlib
          # EGPCS: the e2e server's database and cache come from the environment (playwright.config.js), and the
          # app reads it through $_ENV; the runner's default GPCS leaves $_ENV empty and the workers on :memory:.
          ini-values: variables_order=EGPCS
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # packstub/holler from Packagist (require-dev) and @packstub/holler from npm; npm ci brings Playwright.
      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress
          npm ci
          npx playwright install --with-deps chromium

      # The pages load the committed resources/dist, so check it is what the sources build.
      - name: The committed bundle is up to date
        run: |
          npm run build
          git diff --exit-code --stat -- resources/dist

      # The npm package (@packstub/session-replay): its declarations against what a TypeScript frontend writes, and
      # the built module imported where there is no window (server-side rendering).
      - name: The npm package's types and build
        run: |
          npm run test:types
          node -e "import('./npm/dist/index.js').then((m) => { if (m.isRecording() !== false || JSON.stringify(m.header()) !== '{}') process.exit(1); })"

      - name: Run Assist between two browsers
        run: npm run test:e2e
        env:
          CI: "1"

      - name: Upload the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          # The server's log beside the traces: a 500 in a trace has no body, the exception is only here.
          path: |
            test-results
            vendor/orchestra/testbench-core/laravel/storage/logs

  # The one check the main branch requires (Settings → Rules): green only when every job above is.
  # A new job goes in `needs`, so the required name stays the same when the matrix changes.
  tests-passed:
    name: Tests passed
    if: always()
    needs: [changes, tests, javascript, e2e]
    runs-on: ubuntu-latest

    steps:
      # Every job succeeded, or the test jobs skipped because only docs changed (never skipped for another reason).
      - name: Fail unless every job succeeded or skipped for docs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "Job results: $RESULTS (code changed: $CODE)"
          [ "$CHANGES" = "success" ] || exit 1
          for result in $RESULTS; do
            if [ "$result" = "success" ]; then continue; fi
            if [ "$result" = "skipped" ] && [ "$CODE" = "false" ]; then continue; fi
            exit 1
          done
